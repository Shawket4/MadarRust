# madar-authz: the ONE permission decision library (PERMISSIONS_ARCHITECTURE §3 E).
#
# Canonical copy: MadarRust/authz/crate. The POS core vendors a byte-identical
# copy at madar/rust-core/crates/madar-authz (tool/sync_authz.sh); `crate_hash`
# tests in both repos fail if either copy is edited by hand.
#
# Edition 2021 so it builds inside the POS workspace (2021) and the backend (2024).
[package]
name = "madar-authz"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
