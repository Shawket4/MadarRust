# ============================================================================
# THE permission registry (PERMISSIONS_ARCHITECTURE.md §4.8, architecture E).
#
# The ONE source of truth. `cargo run -p madar-authz --features gen --bin
# authz-gen` generates from this file:
#   - authz/crate/src/generated.rs          (Rust: backend + POS core)
#   - MadarDashboard/src/generated/capabilities.ts + locales
#   - madar/packages/app_core/lib/src/generated/capabilities.dart
#   - the `Capability` OpenAPI enum (through the generated Rust type)
# CI fails when a generated file is stale (`authz-gen --check`).
#
# Rules (enforced by the crate's tests):
# - `id` is stable forever and never reused. Append new capabilities.
# - Every legacy `resource:action` cell of GET /auth/permissions has exactly one
#   capability (`legacy`), so old tablets see exactly what they saw before.
# - `core` roles are a subset of `defaults` (a core grant never widens what a
#   role holds today). Core grants are always on for that role kind and cannot
#   be removed, by the UI or the server.
# - Templates never grant a `risk = "admin"` capability to teller, waiter or
#   kitchen.
#
# Fields:
#   key       domain.object.verb, stable
#   legacy    the old `resource:action` cell this capability answers for
#   group     dashboard grouping
#   tier      core | configurable | advanced | legacy
#               core         always on for `core` role kinds, never a toggle
#               configurable shown, plain names, grouped
#               advanced     behind the "Advanced" section
#               legacy       never shown; kept only so old tablets read the same
#   risk      normal | money | pii | admin
#   defaults  role kinds that get it in the default template:
#               o=org_admin (owner) m=branch_manager t=teller w=waiter k=kitchen
#   core      role kinds for which it is core (subset of defaults)
#   approval  true when an owner may set "ask a manager" instead of "hidden"
#   limits    limit keys it accepts (max_amount, max_percent, max_value,
#             max_age_minutes, own)
#   pos       true when the POS gates a screen or action on it
#   protected true when it can never be denied to an owner
# ============================================================================

