[package]
name = "madar-rust"
version = "0.1.0"
edition = "2024"
default-run = "madar-rust"

[dependencies]
# The shared permission library, from madar-shared (the POS core pins the same
# tag). The registry is generated there, from authz/spec/capabilities.toml.
# Bump the tag in both repos together; see madar-shared's README.
madar-authz        = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# Money rules the till runs too (tax engine, refund split, staff pool/comp,
# reward cover, POS-metrics average): one copy, in madar-shared, same tag.
madar-money        = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# Business-day rules the till runs too (week start, business date, YYMMDD,
# day bounds with the DST-gap rule), same tag.
madar-time         = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# /sync/pull contract pieces the till runs too (type lists, ledger
# classification, the R-checksum, kitchen UUIDv5 ids), same tag.
madar-sync         = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# A till's drawer / Z report fold, the carryover picker and close
# reconciliation the till runs too (the SQL here is pinned to them), same tag.
madar-till         = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# Inventory units and conversion (the till converts a waste with them), same tag.
madar-units        = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# The canonical phone, order-ref formats and the member card token the till
# reads and writes too, same tag.
madar-ids          = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# Dawam rules the staff app runs too (the geofence, the pay period, the
# offline stamp's shape and its OpenAPI schema; the HMAC stays here), same tag.
madar-dawam        = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0", features = ["utoipa"] }
# How a sale line is priced from the catalogue (size, swaps, add-ons, optional
# fields): the rule this server defined and the till now runs too, same tag.
madar-catalog      = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
# Which rewards a sale may take (strict here, trimming on the till), same tag.
madar-loyalty      = { git = "https://github.com/Shawket4/madar-shared", tag = "v0.4.0" }
actix-web = { version = "4", features = ["compress-brotli", "compress-gzip", "compress-zstd", "rustls-0_23"] }
actix-cors         = "0.7"
actix-multipart    = "0.8"
actix-files        = "0.6"
tokio              = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tokio-stream       = { version = "0.1", features = ["sync", "time"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "v5", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
# Timezone database. A reporting period ("last month", "yesterday") must resolve
# in the MERCHANT's timezone — org/branch-configured, never the server's — so the
# analytics layer converts local period bounds to UTC itself rather than pushing
# date arithmetic into every query. Pure data, no C dependency.
chrono-tz          = "0.10"
sha2               = "0.10"
# Apple Wallet: SHA-1 manifest digests (the format Apple specifies) and the
# .pkpass zip. Both were already in the tree transitively; named here because
# `src/loyalty/wallet/apple.rs` uses them directly.
sha1               = "0.10"
# Apple Wallet pass signing: a PKCS#7 detached signature over the manifest.
# OpenSSL rather than the pure-Rust CMS crates because `cms` is still a
# pre-release and a signature iOS rejects fails silently, with no diagnostic
# anyone can act on — `PKCS7_sign` is what every pass implementation uses.
# The builder stage already carries libssl-dev; the runtime stage gains libssl3.
openssl            = "0.10"
zip                = { version = "3", default-features = false }
jsonwebtoken       = { version = "10", features = ["rust_crypto"] }
bcrypt             = "0.19"
argon2             = "0.5"
dotenvy            = "0.15"
thiserror          = "2"
tracing            = "0.1"
tracing-actix-web  = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures            = "0.3"
image              = { version = "0.25", features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Wallet strip images (src/loyalty/wallet/apple.rs). Apple Wallet takes PNG and
# nothing else, and the strip is a PHOTOGRAPH — the one thing PNG is worst at.
# Three strips were 93% of a 832 KB pass.
#
# `png` is the encoder `image` already uses; naming it directly buys the palette
# (PNG8) colour type and the compression/filter knobs `image`'s convenience
# `write_to` does not expose. Already in the tree via `image` — no new code
# compiled, no new transitive dependency.
#
# `exoquant` is the quantiser. It IS new: ~1.4k lines of pure Rust, MIT, ZERO
# dependencies of its own (its only optional one, `rand`, stays off), no
# `unsafe`, no I/O — a pure function from pixels to a palette. It is unmaintained
# (last release 2018), which is affordable precisely because it is pure and
# vendorable if it ever breaks. It was chosen over `imagequant` (libimagequant /
# pngquant), which is the better-known quantiser but is GPL-3.0-or-commercial —
# a licensing decision for the owner, not a dependency bump. Measured: exoquant
# at 256 colours with Floyd-Steinberg is visually indistinguishable from the
# lossless strip at 2.9x smaller; NeuQuant (`color_quant`, already in the tree
# and therefore free) was tried first and REJECTED on looking at the output —
# visible posterisation in the highlights.
png                = "0.18"
exoquant           = { version = "0.2", default-features = false }
rustls             = "0.23"
rustls-pemfile     = "2"
# sqlx HELD at 0.8: 0.9 gates every dynamic SQL string behind AssertSqlSafe
# (~71 call sites here) — a wide mechanical migration deferred so it does not
# collide with the in-flight modifier-redesign handler edits.
sqlx               = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "bigdecimal", "rust_decimal"] }
bigdecimal         = { version = "0.4", features = ["serde"] }
rust_decimal       = { version = "1", features = ["serde-float", "maths"] }
rust_decimal_macros = "1"
# `decimal_float`, NOT `decimal`: rust_decimal is built with `serde-float`, so a
# Decimal is serialized as a JSON number. The `decimal` feature would document it
# as a string, and every generated client would then send the wrong type.
utoipa = { version = "5.5.0", features = ["actix_extras", "chrono", "uuid", "decimal_float"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
reqwest = { version = "0.13.4", features = ["json"] }
base64 = "0.22"
# Used by the Sentry message sanitiser (`observability::scrub`) to redact
# personal data inside free text — exception messages and log lines that
# interpolated a value the key-based scrubber can never see. Already in the tree
# transitively; made direct so the compliance control owns its dependency.
regex              = "1"
urlencoding = "2.1.3"
actix-governor = "0.10"
# Ergonomic async trait objects for the swappable AI provider interface
# (`src/ai/provider.rs`) — one small, ubiquitous proc-macro crate.
async-trait = "0.1"
moka               = { version = "0.12", features = ["future"] }
# QR card generation. `resvg` re-exports `usvg` and `tiny-skia` from the same
# release, so depending on it alone keeps the SVG/raster stack version-locked
# (no chance of a mismatched usvg/tiny-skia).
qrcode             = { version = "0.14", default-features = false }
# default-features=false drops `system-fonts`/`raster-images`: text shaping only,
# and font resolution is limited to the faces we explicitly load (no system-font
# fallback, no runtime filesystem dependency).
resvg              = { version = "0.47", default-features = false, features = ["text"] }
# Error reporting to the self-hosted Sentry. `default-features = false` drops the
# native-tls transport (this binary is rustls end-to-end — see build_tls_config
# and the sqlx/reqwest features above; pulling OpenSSL in for crash reports would
# be the only native-TLS dependency in the tree) and drops `debug-images`, whose
# only job is symbolicating a stripped release binary we don't upload debug files
# for. `logs`/`metrics` stay off: this is an error reporter, not a log sink.
#
# `release-health` is deliberately OFF. It emits a session envelope per request,
# so envelope volume tracked total traffic rather than the sample rate (40 HTTP
# requests produced 63 envelopes) — and every one of those crosses a residential
# uplink to reach the self-hosted instance. Release adoption/crash-free-rate is
# not worth that bandwidth here; errors and sampled traces are.
sentry             = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-actix       = "0.49"
# Bridges `tracing` into Sentry. The reason it is here is sqlx: it logs every
# statement to the `sqlx::query` target with its elapsed time, so this layer
# turns those into breadcrumbs and an issue arrives carrying the queries that
# ran just before it. See `observability::tracing_layer` for the mapping.
sentry-tracing     = "0.49"
# Assets (src/assets): one ingest pipeline. `webp` wraps libwebp (vendored C
# build) for the lossy q80/m6 encoder the image crate lacks; `zstd` compresses
# Lottie JSON once; `tar` writes deterministic ustar headers for base bundles and
# the top-up stream; `hmac` signs org-scoped asset URLs; `infer` sniffs magic
# bytes so a client MIME/extension is never trusted.
webp               = "0.3"
zstd               = "0.13"
tar                = "0.4"
hmac               = "0.12"
ed25519-dalek      = "2"
infer              = "0.19"
url                = "2"
# Names are compared NFC-folded (customers::same_name).
unicode-normalization = "0.1"
bytes              = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debug info trimmed to line tables (backtraces keep file:line); dependencies
# carry none. Faster builds and a much smaller target dir.
[profile.dev]
debug = "line-tables-only"
# Never strip. Cargo strips AUTOMATICALLY whenever a profile lowers debug info,
# and Apple's `strip` on Xcode 27 / macOS 27 corrupts what it touches: a
# proc-macro dylib (sqlx-macros) that `dlopen` refuses with "mis-aligned
# LINKEDIT string pool", and a test binary whose ad-hoc signature no longer
# matches, which macOS then kills on exec with SIGKILL — and reports to the
# user as malware. The symptom is deterministic and survives `cargo clean -p`,
# re-signing with codesign, and freeing disk, because each rebuild strips
# again. See CLAUDE.md.
strip = false

[profile.dev.package."*"]
debug = false
strip = false

# `cargo test` inherits dev, but spell it out: these are the binaries macOS was
# killing, and a later edit to dev must not silently re-enable stripping here.
[profile.test]
strip = false

[profile.test.package."*"]
strip = false

# The POS real-backend scenarios (madar/tool/offline_b_backend.sh): release
# optimisations without LTO, so the scenario backend builds in minutes.
[profile.scenario]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
# `release` strips (it ships to Linux, where stripping is fine and the size
# matters). This profile never ships — it only builds a backend for the POS
# scenarios to talk to on THIS machine — and on macOS 27 a stripped binary is
# corrupt, so the scenario backend would not run at all. Inheriting `release`
# means inheriting `strip = true`, hence the explicit override.
strip = false

[dev-dependencies]
# Measures the shipped font in the QR-card layout test, so the "Powered by"
# lockup is checked against real glyph advances rather than a guess at them.
ttf-parser = "0.25"
tempfile = "3.27.0"
# Already in the tree via actix-web; named directly so tests can write
# `Service<actix_http::Request>` bounds for shared helpers.
actix-http = "3"
# Decode-verify rasterised QR output in tests (scannability is non-negotiable).
rqrr = "0.10"
# `test` adds sentry's in-memory TestTransport, which lets the observability
# tests assert on the exact events that WOULD have been sent — the only way to
# prove the PII scrubber holds without pointing a test at the live Sentry.
sentry = { version = "0.49", default-features = false, features = ["test"] }

[[bin]]
name = "madar-rust"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[[bin]]
name = "backfill-cost-snapshots"
path = "src/bin/backfill_cost_snapshots.rs"

[[bin]]
name = "backfill-recipe-units"
path = "src/bin/backfill_recipe_units.rs"

[[bin]]
name = "customers-backfill-dry-run"
path = "src/bin/customers_backfill_dry_run.rs"

[[bin]]
name = "backfill-order-ref"
path = "src/bin/backfill_order_ref.rs"

[[bin]]
name = "backfill-menu-unification"
path = "src/bin/backfill_menu_unification.rs"

[[bin]]
name = "bundle-margin-flip"
path = "src/bin/bundle_margin_flip.rs"

[[bin]]
name = "backfill-assets"
path = "src/bin/backfill-assets.rs"

[[bin]]
name = "fuzz-token"
path = "src/bin/fuzz_token.rs"

# Local development only: seeds a self-contained staff demo org. Never run
# against production — it deletes and recreates the org by slug.
[[bin]]
name = "seed-staff-demo"
path = "src/bin/seed_staff_demo.rs"

[lib]
name = "madar_rust"
path = "src/lib.rs"

[[bin]]
name = "authz-parity"
path = "src/bin/authz_parity.rs"
