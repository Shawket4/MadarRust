# links.madar-pos.cloud: the links page for a shop WITHOUT its own hostname.
#
# A shop on the branding tier has its links page at the root of
# `<slug>.madar-pos.cloud` (see deploy/shop/nginx-wildcard.conf). Every other
# shop's page is `https://links.madar-pos.cloud/<org_id>`: the backend builds
# that address from `PUBLIC_LINKS_BASE_URL` for the editor and the links QR.
# If this vhost is not deployed, leave PUBLIC_LINKS_BASE_URL unset. The editor
# then says the shop has no address yet, which is better than printing a code
# that leads nowhere.
#
# `links` is already in the reserved-slug list (`src/orgs/slugs.rs`), so no
# shop can take this name.
#
# Built by `npm run build:links` (generic, base `/`) → dist-links →
# /var/www/madar-links. Same shape as the loyalty vhost: static bundle plus a
# same-origin /api/ proxy. The zone is proxied through Cloudflare, so TLS is
# handled the same way as the other proxied hosts on the box. Copy the
# listen/ssl lines from the live loyalty vhost.

server {
    listen 80;
    server_name links.madar-pos.cloud;

    root /var/www/madar-links;
    index links.html;

    location /api/ {
        proxy_pass http://madar_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /links.html;
    }
}
