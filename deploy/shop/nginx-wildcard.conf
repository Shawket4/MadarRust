# *.madar-pos.cloud -- every branded shop, one block.
#
# Installed on the box as /etc/nginx/sites-available/shop-wildcard (enabled by
# symlink). This file is the source; copy it over, `nginx -t`, reload.
#
# Reached ONLY through Cloudflare (the wildcard A record is proxied), so the
# certificate here is the Cloudflare Origin CA pair, which is trusted by
# Cloudflare and nobody else. That is deliberate: it is valid until 2041 and
# has no renewal to fail. If a shop hostname is ever switched to DNS-only,
# this certificate stops being acceptable to browsers and that host needs a
# publicly-trusted one instead.
#
# PAGES go to the backend's tenant shell (src/tenant_shell.rs): the same app
# entry, with the shop's title, description, canonical address, share tags,
# JSON-LD and a <noscript> copy of its links and menu written in, and a real
# 404 for an unknown shop or a path the apps don't route. If the backend
# answers 5xx or is down, the page falls back to the static entry exactly as
# before (@static_*), so the apps never stop loading because of it.
# FILES (assets, icons, robots.txt) are served from disk as before.
#
# Needs: snippets/madar-security-headers.conf (deploy/nginx in MadarDashboard),
# the `madar_api` upstream in nginx.conf, and the backend container mounting
# the three web roots read-only (docker-compose.yml, MADAR_SHELL_DIR).

server {
    listen 80;
    listen [::]:80;
    server_name *.madar-pos.cloud;

    # Keep ACME reachable in case a shop host ever needs a public certificate.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.madar-pos.cloud;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin/key.pem;

    # Origin lockdown: this hostname is proxied, so legitimate traffic can only
    # arrive from Cloudflare. The origin IP is publicly known, so without this
    # anyone can address the box directly and skip the edge's rate limiting and
    # WAF. Keyed on $realip_remote_addr (see the generator), NOT allow/deny,
    # which real_ip would defeat. NEVER add this to a DNS-only vhost (api,
    # demo-api, sentry) or another tenant's config -- they are reached directly
    # by design.
    include /etc/nginx/cloudflare-only.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Restore the real client IP from CF-Connecting-IP. The public endpoints are
    # rate-limited per IP; without this every customer arrives as a Cloudflare
    # address and one busy branch exhausts the budget for all of them.
    include /etc/nginx/cloudflare-real-ip.conf;

    client_max_body_size 10M;

    # On every response, redirects and errors included. A location with an
    # add_header of its own inherits none of these, so each such location
    # includes the snippet again.
    include snippets/madar-security-headers.conf;

    # The loyalty bundle is the root.
    root /var/www/madar-loyalty;

    # `^~` on every prefix location below: a regex location (the static-file
    # one) otherwise beats a prefix one, and would take /api/... from the
    # backend and /order/assets/... from their cache headers.

    # A file in the build or a real 404, never a page.
    location ^~ /.well-known/ { try_files $uri =404; }

    location ^~ /api/uploads/ {
        alias /opt/madar-rust/uploads/;
        expires 30d; access_log off; try_files $uri =404;
    }

    # Same-origin API. Every bundle resolves WHICH shop from the hostname by
    # calling /api/public/orgs/brand?slug=<first label>, so this is not optional.
    # madar_api is the upstream defined in nginx.conf -- use the name.
    location ^~ /api/ {
        proxy_pass http://madar_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        gzip off;
        proxy_max_temp_file_size 0;
    }

    # Do NOT add `location ~* \.pkpass$`. A regex location beats a prefix one
    # unless the prefix is `^~`; /api/ is, and must stay so: the pass download
    # (/api/public/loyalty/pass/.../apple.pkpass) and the card QR (.../qr.png)
    # would otherwise be answered from disk with a 404. The backend already
    # sends the right content type and disposition.

    # Bare mount names. `location /order/` only matches WITH the trailing
    # slash; without these, /order falls through to `location /` and is
    # answered as a loyalty page. $is_args$args preserves ?branch=&table=.
    location = /order { return 301 /order/$is_args$args; }
    location = /book  { return 301 /book/$is_args$args; }

    # ONE host, THREE bundles. Each is a separately built bundle and they are
    # NOT interchangeable: the :shop builds anchor their assets at /order/ and
    # /book/. Each falls back to its OWN entry file -- none is index.html.

    # Hashed, content-addressed bundles: safe to cache forever.
    location ^~ /order/assets/ {
        alias /var/www/madar-order-shop/assets/;
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off; try_files $uri =404;
    }

    location ^~ /book/assets/ {
        alias /var/www/madar-reservations-shop/assets/;
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off; try_files $uri =404;
    }

    location ^~ /assets/ {
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off; try_files $uri =404;
    }

    # Pages under a mount: a file in the bundle is served as is; anything else
    # is a page, rendered by the tenant shell (which 404s what the app doesn't
    # route). Trailing slashes on BOTH sides, so /orderfoo cannot match.
    location ^~ /order/ {
        alias /var/www/madar-order-shop/;
        try_files $uri @shell_order;
    }

    location ^~ /book/ {
        alias /var/www/madar-reservations-shop/;
        try_files $uri @shell_book;
    }

    # STATIC ROOT FILES -- fonts, icons, the Lottie animation, og.jpg. Not
    # content-hashed, so a week with revalidation rather than a year. A missing
    # one is a 404, never a page.
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|otf|lottie|webmanifest)$ {
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # The links page, rewards, join and the card. robots.txt and the other root
    # files are served from disk; every other path is a page.
    location / {
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri @shell_links;
    }

    # ── The tenant shell ────────────────────────────────────────────────────
    # The page's host and path travel as headers; the backend answers 200 (the
    # page), 404 (no such shop, or not a page), or 429/5xx, which fall back to
    # the static entry: a throttled or broken shell must never cost a customer
    # the app. Short timeouts: a page must never wait on a slow backend
    # longer than the static file would have taken to fail over.

    location @shell_links {
        rewrite ^ /public/tenant-shell? break;
        proxy_pass http://madar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Shell-Host $host;
        proxy_set_header X-Shell-Path $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @static_links;
    }

    location @shell_order {
        rewrite ^ /public/tenant-shell? break;
        proxy_pass http://madar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Shell-Host $host;
        proxy_set_header X-Shell-Path $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @static_order;
    }

    location @shell_book {
        rewrite ^ /public/tenant-shell? break;
        proxy_pass http://madar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Shell-Host $host;
        proxy_set_header X-Shell-Path $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @static_book;
    }

    # The fallbacks: the static entries, as served before the shell existed.
    location @static_links {
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /loyalty.html =404;
    }

    location @static_order {
        root /var/www/madar-order-shop;
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /order.html =404;
    }

    location @static_book {
        root /var/www/madar-reservations-shop;
        include snippets/madar-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /reservations.html =404;
    }

    access_log /var/log/nginx/shop-wildcard.access.log;
}
