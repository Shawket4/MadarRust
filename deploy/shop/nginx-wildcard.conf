# *.madar-pos.cloud → every branded shop, one vhost.
#
# HISTORICAL NOTE, and the reason this file reads the way it does. It began as
# THE TEMPLATE for one hand-edited per-shop vhost, because that is what the box
# was running and no copy existed anywhere — the only description of how a shop
# is served lived on the server. Production has since moved to a single
# WILDCARD block (`/etc/nginx/sites-available/wildcard.madar-pos.cloud`) and the
# per-shop files are retired. This is the checked-in description of that block.
#
# ── How TLS actually works here ──────────────────────────────────────────────
#
# NOT a wildcard Let's Encrypt certificate. The zone is on Cloudflare with
# proxying ON: Cloudflare terminates TLS for browsers with its own Universal
# SSL, and reaches this origin over a Cloudflare Origin CA certificate valid to
# 2041. So there is no DNS-01 challenge, no wildcard lineage, and nothing to
# renew.
#
# The cost of that, and it is a real one: the Origin CA certificate is trusted
# by CLOUDFLARE ALONE. A shop hostname switched to DNS-only serves a browser a
# certificate it rejects. Shop hosts must stay proxied, or get a publicly
# trusted certificate of their own first.
#
# `api.`, `demo-api.` and `sentry.` are deliberately DNS-only and keep their own
# publicly trusted Let's Encrypt certificates, because they are reached directly
# rather than through the proxy. Do NOT extend Cloudflare real-IP restoration to
# those vhosts: they are reachable without going through Cloudflare, so trusting
# `CF-Connecting-IP` there would let anyone forge a client address straight past
# the per-IP rate limits. Real-IP restoration belongs only to proxied vhosts —
# on the box that is `/etc/nginx/cloudflare-real-ip.conf`, refreshed monthly.
#
# ── Before this serves anything ──────────────────────────────────────────────
#
#   1. DNS. `*.madar-pos.cloud` → the box, PROXIED through Cloudflare.
#   2. `app.`, `dashboard.` and `track.` need their own explicit block (an
#      explicit server_name beats a wildcard), or the wildcard answers for them
#      as if they were shops. They are also in the backend's reserved-slug list;
#      that block is the other half of the same guarantee.
#   3. `PUBLIC_SHOP_SUBDOMAINS=1` in the backend's environment. Off by default,
#      because with it off every QR code keeps pointing at the generic hosts,
#      which is the behaviour that works. Turn it on LAST.
#
# A shop with no slug has no address. The backend refuses to build a URL for one
# and falls back to the generic host, which is what an organisation that has
# never been given a web address should get.

server {
    listen 80;
    listen [::]:80;
    server_name *.madar-pos.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.madar-pos.cloud;

    # The Cloudflare ORIGIN CA certificate — see the TLS note at the top. This
    # is not a Let's Encrypt lineage and certbot does not manage it; it is what
    # Cloudflare's proxy presents to, not what a browser sees.
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin/privkey.pem;

    # ONE host, THREE mounts. Each is a separately built bundle and the builds
    # are NOT interchangeable: the `:shop` builds bake their mount into every
    # asset URL and into the router's basepath. Deploying the generic build
    # here gives a white page with a 404 on every asset.
    #
    #   /        loyalty card + join   npm run build:loyalty            dist-loyalty
    #   /order/  the menu              npm run build:order:shop         dist-order-shop
    #   /book/   reservations          npm run build:reservations:shop  dist-reservations-shop
    #
    # Each SPA falls back to its OWN entry file. None of them is index.html.

    # `/order` and `/order/` are DIFFERENT URLS, and a person typing an address
    # off a menu types the first one. Without these two redirects it falls
    # through to `location /` below and gets the loyalty card — the shop is
    # shown a real page that is simply not its menu, which is worse than a 404
    # because nothing looks broken.
    #
    # `location =` is an EXACT match, so this cannot swallow `/orderfoo`, which
    # is the thing the trailing slash on the mount exists to prevent.
    location = /order { return 301 /order/; }
    location = /book  { return 301 /book/; }

    # Trailing slashes on both sides, so `/orderfoo` cannot match `/order`.
    #
    # And NO `$uri/` in the try_files. With `alias`, `$uri/` matches the mount
    # DIRECTORY, which sends nginx to the index handler — where it looks for
    # this server's `index` (loyalty.html, inherited from the root block below)
    # inside the shop build, does not find it, and returns 403 instead of the
    # SPA. The bare `$uri` then the entry file is the whole of what a
    # single-page app needs.
    location /order/ {
        alias /var/www/madar-order-shop/;
        try_files $uri /order/order.html;
    }

    location /book/ {
        alias /var/www/madar-reservations-shop/;
        try_files $uri /book/reservations.html;
    }

    # The API, same-origin. Every bundle resolves WHICH shop from the hostname
    # by calling `/api/public/orgs/brand?slug=<first label>`, so this is not
    # optional — without it the page cannot find out whose shop it is.
    # `upstream madar_api { server 127.0.0.1:8081; keepalive 32; }` is defined
    # once in nginx.conf, not per vhost — every Madar block on the box already
    # uses it. A vhost deployed to a box without it fails to start with "host
    # not found in upstream", which is the loud failure you want over a literal
    # address that silently outlives a port change.
    location /api/ {
        proxy_pass http://madar_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The public endpoints are rate-limited per IP. Without this every
        # customer shares the proxy's address and one busy branch exhausts the
        # budget for all of them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do NOT add `location ~* \.pkpass$`. A regex location beats a prefix one,
    # so it would capture `/api/public/loyalty/pass/…/apple.pkpass` and proxy
    # it WITHOUT stripping `/api/` — the backend 404s and the customer gets
    # nothing. The backend already sends the right type and disposition.

    # The card is the root.
    root /var/www/madar-loyalty;
    index loyalty.html;
    location / {
        try_files $uri $uri/ /loyalty.html;
    }
}
