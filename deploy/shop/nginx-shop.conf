# <slug>.madar-pos.cloud → one shop's own address.
#
# THE TEMPLATE. The box has been running one of these, hand-edited, with no
# copy anywhere — so the only description of how a shop is served lived on the
# server, and the next person onboarding a shop would have had to read it off a
# working box and hope they copied the right parts.
#
# ── Before this serves anything ──────────────────────────────────────────────
#
# Three things have to be true, and today only the first is:
#
#   1. DNS. `*.madar-pos.cloud` A record → this box. LIVE.
#      There is no AAAA wildcard, though the box has public IPv6 and nginx
#      listens on [::]:443, so an IPv6-only client reaches nothing on a shop
#      host. Add the AAAA or accept that gap knowingly.
#
#   2. A wildcard TLS certificate covering `*.madar-pos.cloud`. NOT PRESENT.
#      Every certificate on the box today is a single explicit hostname issued
#      over HTTP-01. A wildcard cannot be issued that way — it needs DNS-01,
#      and the zone is on a provider with no certbot plugin, so this is a
#      decision (scripted API hook, or move the zone) and not a config edit.
#
#      Until it exists, a shop host serves the default vhost's self-signed
#      `CN=invalid-host.invalid` and then drops the connection: a full-page
#      certificate warning on something printed and stuck to a table.
#
#   3. `PUBLIC_SHOP_SUBDOMAINS=1` in the backend's environment. Off by default,
#      because with it off every QR code keeps pointing at the generic hosts,
#      which is the behaviour that works. Turn it on LAST — after 1 and 2.
#
# ── Substitutions ────────────────────────────────────────────────────────────
#
#   <slug>  the shop's `organizations.slug`
#
# A blank slug is not an address. There is a live org that is branded, active
# and has `slug = ''`; the backend refuses to build a URL for it and falls back
# to the generic host. Do not create a vhost for one.
#
#   sudo cp nginx-shop.conf /etc/nginx/sites-available/<slug>.madar-pos.cloud
#   sudo ln -sf /etc/nginx/sites-available/<slug>.madar-pos.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# With a wildcard certificate in place this file is what a WILDCARD vhost looks
# like too: replace the `server_name` with `*.madar-pos.cloud` and deploy it
# once instead of per shop. Note that every generic host — api, order,
# reservations, loyalty, get, legal, sentry, demo, www — has its own explicit
# block, and an explicit `server_name` beats a wildcard, so those are safe. But
# `app.`, `dashboard.` and `track.` have NO block today, and a wildcard would
# capture them the moment anyone points them here.

server {
    listen 80;
    listen [::]:80;
    server_name <slug>.madar-pos.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <slug>.madar-pos.cloud;

    # certbot writes these. With a wildcard, point both at the wildcard lineage
    # instead and this file stops being per-shop.
    ssl_certificate     /etc/letsencrypt/live/<slug>.madar-pos.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<slug>.madar-pos.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ONE host, THREE mounts. Each is a separately built bundle and the builds
    # are NOT interchangeable: the `:shop` builds bake their mount into every
    # asset URL and into the router's basepath. Deploying the generic build
    # here gives a white page with a 404 on every asset.
    #
    #   /        loyalty card + join   npm run build:loyalty            dist-loyalty
    #   /order/  the menu              npm run build:order:shop         dist-order-shop
    #   /book/   reservations          npm run build:reservations:shop  dist-reservations-shop
    #
    # Each SPA falls back to its OWN entry file. None of them is index.html.

    # Trailing slashes on both sides, so `/orderfoo` cannot match `/order`.
    location /order/ {
        alias /var/www/madar-order-shop/;
        try_files $uri $uri/ /order/order.html;
    }

    location /book/ {
        alias /var/www/madar-reservations-shop/;
        try_files $uri $uri/ /book/reservations.html;
    }

    # The API, same-origin. Every bundle resolves WHICH shop from the hostname
    # by calling `/api/public/orgs/brand?slug=<first label>`, so this is not
    # optional — without it the page cannot find out whose shop it is.
    # `upstream madar_api { server 127.0.0.1:8081; keepalive 32; }` is defined
    # once in nginx.conf, not per vhost — every Madar block on the box already
    # uses it. A vhost deployed to a box without it fails to start with "host
    # not found in upstream", which is the loud failure you want over a literal
    # address that silently outlives a port change.
    location /api/ {
        proxy_pass http://madar_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The public endpoints are rate-limited per IP. Without this every
        # customer shares the proxy's address and one busy branch exhausts the
        # budget for all of them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Do NOT add `location ~* \.pkpass$`. A regex location beats a prefix one,
    # so it would capture `/api/public/loyalty/pass/…/apple.pkpass` and proxy
    # it WITHOUT stripping `/api/` — the backend 404s and the customer gets
    # nothing. The backend already sends the right type and disposition.

    # The card is the root.
    root /var/www/madar-loyalty;
    index loyalty.html;
    location / {
        try_files $uri $uri/ /loyalty.html;
    }
}
