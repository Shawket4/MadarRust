# cargo nextest run — per-test process isolation, real parallelism, and no
# silent hangs: a test slower than 60s is reported, and killed at 3 min.

# NOTE: export MADAR_FAST_TEST_POOLS=1 when running these suites, or every test
# that serves a request waits ~5s for its throwaway database to become
# droppable — see src/db.rs. scripts/run_tests.sh does it for you. It cannot be set
# here: nextest 0.9.144 ignores an [env] table.
[profile.default]
# These tests are database-bound: each waits on Postgres far more than it uses a
# CPU, so 12 (one per core) leaves the machine idle. The :5433 cluster allows 500
# connections. Raise only with the RAM cluster; measure before changing.
test-threads = 24
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# The limiter's address-ceiling test paces itself against the wall clock and
# failed once under a full-workspace load (17 s vs 2.3 s alone, FOLLOWUPS
# 2026-09-25). One retry, so a loaded box doesn't fail the gate; a real
# regression still fails twice.
[[profile.default.overrides]]
filter = 'test(many_accounts_share_one_address_ceiling)'
retries = 1
