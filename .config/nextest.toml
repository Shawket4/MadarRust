# cargo nextest run — per-test process isolation, real parallelism, and no
# silent hangs: a test slower than 60s is reported, and killed at 3 min.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
retries = 0
status-level = "slow"
final-status-level = "slow"

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
